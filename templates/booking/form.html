{% extends "base.html" %}

{% block content %}
<section class="panel narrow">
    <h1>{{ heading|default:"Log in" }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Continue</button>
    </form>

    <p><a href="{% url 'register' %}">Create account</a></p>
</section>
{% endblock %}
